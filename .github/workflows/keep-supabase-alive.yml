name: Keep Supabase Alive

# The app's Vercel cron (see vercel.json) pings /api/keep-alive daily. This
# workflow is an independent backup that talks to Supabase directly, so it keeps
# working even if the app deployment is down.
on:
  schedule:
    # Runs at 00:00 UTC every 3 days to ensure database stays active
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must be set as GitHub repository secrets."
            exit 1
          fi

          echo "Pinging Supabase to prevent auto-pausing due to inactivity..."
          curl -sS -f -X GET "$SUPABASE_URL/rest/v1/companions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo -e "\nSupabase REST API successfully pinged."
